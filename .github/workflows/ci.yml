name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: tests
      - name: Demo from the installed command
        run: |
          cd "$RUNNER_TEMP"
          intune-why demo --no-open --html report.html
          grep -q '"source": "demo"' report.html
