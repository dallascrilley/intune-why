[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "intune-why"
version = "0.1.0"
description = "Find the few fixes that clear most Intune noncompliance."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Dallas Crilley"}]
keywords = ["intune", "microsoft-graph", "endpoint-management", "compliance", "entra"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
intune-why = "intune_why.cli:main"

[project.urls]
Repository = "https://github.com/dallascrilley/intune-why"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intune_why = ["templates/*.html", "data/*.json"]
